<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="論文の英語">
<meta name="format-detection" content="telephone=no">
<title>論文の英語 単語帳</title>
<meta name="description" content="論文の英語の本文によく出る単語・専門語・連語・定型表現の単語帳（例文なし）">
<style>
:root {
  --bg: #f7f6f2;
  --surface: #ffffff;
  --surface-2: #f0eee8;
  --text: #1d1d1b;
  --muted: #5f5e58;
  --faint: #8a8880;
  --line: #dddad0;
  --accent: #2e5d8a;
  --accent-soft: #e3ecf5;
  --accent-text: #ffffff;
  --good: #2f7d4f;
  --good-soft: #e1f1e7;
  --bad: #b3412e;
  --bad-soft: #f8e4df;
  --warn: #8a6a12;
  --mark: #fde9a8;
  --mark-text: #1d1d1b;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.05);
  --radius: 10px;
  --serif: "Charter", "Georgia", "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", "Noto Sans JP", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --surface: #1f1f1d; --surface-2: #2a2a27; --text: #ecebe6; --muted: #b3b1a8; --faint: #8d8b83;
    --line: #3a3935; --accent: #8db8e3; --accent-soft: #24384d; --accent-text: #0e1a26; --good: #7cc99a; --good-soft: #1e3427;
    --bad: #f0907c; --bad-soft: #3d2420; --warn: #e2c26a; --mark: #5c4c14; --mark-text: #fff6d8;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --surface: #1f1f1d; --surface-2: #2a2a27; --text: #ecebe6; --muted: #b3b1a8; --faint: #8d8b83;
  --line: #3a3935; --accent: #8db8e3; --accent-soft: #24384d; --accent-text: #0e1a26; --good: #7cc99a; --good-soft: #1e3427;
  --bad: #f0907c; --bad-soft: #3d2420; --warn: #e2c26a; --mark: #5c4c14; --mark-text: #fff6d8;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
header.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1080px; margin: 0 auto; padding: 10px 16px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
.brand .sub { color: var(--muted); font-size: 12px; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-top: 6px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex: 0 0 auto; border: 0; background: none; padding: 8px 12px 9px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-size: 14px; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
main { max-width: 1080px; margin: 0 auto; padding: 16px; }
.panel { display: none; }
.panel.active { display: block; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; min-height: 36px; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.small { padding: 3px 9px; min-height: 28px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, nav.tabs button:focus-visible, select:focus-visible, input:focus-visible, .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select, input[type="search"], input[type="text"], input[type="number"] { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; min-height: 36px; max-width: 100%; }
label.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); cursor: pointer; }
.chip { display: inline-block; font-size: 12px; line-height: 1.5; padding: 0 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.k-word { background: var(--accent-soft); color: var(--accent); }
.chip.dom { background: var(--good-soft); color: var(--good); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }

/* 絞り込み */
.filters { margin-bottom: 14px; }
.filters summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 4px 0; }
.filters .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 12px; margin-top: 8px; }
.filters .grid label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
.filters .count { font-size: 13px; color: var(--muted); margin-top: 6px; }

/* 単語帳 */
.study-head { margin-bottom: 10px; }
.flash { min-height: 300px; display: flex; flex-direction: column; }
.flash .front { text-align: center; padding: 18px 4px 8px; }
.hw { font-family: var(--serif); font-size: 30px; line-height: 1.25; margin: 4px 0 8px; word-break: break-word; }
.hw.ja { font-family: var(--sans); font-size: 24px; }
.flash .back { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 12px; }
.meaning { font-size: 19px; font-weight: 600; margin: 2px 0 4px; }
.note { color: var(--muted); margin: 0 0 8px; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: auto; padding-top: 14px; }
.grades .btn { display: flex; flex-direction: column; align-items: center; line-height: 1.25; padding: 8px 4px; }
.grades .btn small { color: var(--faint); font-size: 11px; }
.grades .again { border-color: var(--bad); color: var(--bad); }
.grades .good { border-color: var(--good); color: var(--good); }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--faint); }
.done-box { text-align: center; padding: 30px 10px; }

/* 例文 */
.exs { margin: 8px 0 0; padding: 0; list-style: none; }
.exs li { padding: 8px 0; border-top: 1px solid var(--line); }
.exs li:first-child { border-top: 0; }
.ex-text { font-family: var(--serif); font-size: 16px; line-height: 1.6; }
.ex-text mark { background: var(--mark); color: var(--mark-text); border-radius: 3px; padding: 0 2px; }
.ex-text .math { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.src { font-size: 12px; color: var(--faint); margin-top: 2px; }
.src details { display: inline; }
.src summary { display: inline; cursor: pointer; list-style: none; }
.src summary::-webkit-details-marker { display: none; }
.src .title { display: block; color: var(--muted); margin-top: 2px; }
.col { font-size: 13px; color: var(--muted); margin: 6px 0; }
.col b { color: var(--text); font-weight: 600; }

/* 問題 */
.quiz .prompt { font-family: var(--serif); font-size: 18px; line-height: 1.65; margin: 6px 0 12px; }
.quiz .prompt.ja { font-family: var(--sans); font-size: 20px; font-weight: 600; }
.blank { display: inline-block; min-width: 5.5em; border-bottom: 2px solid var(--accent); text-align: center; color: var(--accent); font-family: var(--sans); font-size: 15px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; cursor: pointer; min-height: 48px; display: flex; gap: 8px; align-items: flex-start; }
.opt .n { font-family: var(--mono); font-size: 12px; color: var(--faint); margin-top: 2px; }
.opt.en { font-family: var(--serif); font-size: 16px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.correct { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.feedback { margin-top: 12px; padding: 10px 12px; border-radius: 8px; }
.feedback.ok { background: var(--good-soft); }
.feedback.ng { background: var(--bad-soft); }
.typed { display: flex; gap: 8px; }
.typed input { flex: 1; font-family: var(--serif); font-size: 16px; }
.qstats { font-size: 13px; color: var(--muted); }

/* 一覧 */
.list { margin-top: 10px; }
.item-row { display: grid; grid-template-columns: 14px minmax(0, 1.2fr) minmax(0, 1.6fr) auto; gap: 10px; align-items: baseline; padding: 9px 10px; border-bottom: 1px solid var(--line); cursor: pointer; background: var(--surface); }
.item-row:hover { background: var(--surface-2); }
.item-row .h { font-family: var(--serif); font-size: 16px; overflow-wrap: anywhere; }
.item-row .m { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.item-row .np { font-size: 12px; color: var(--faint); white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--line); }
.dot.s-learning { background: var(--warn); }
.dot.s-learned { background: var(--good); }
.dot.s-known { background: var(--accent); }
.list-wrap { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.more { text-align: center; padding: 12px; }

/* 詳細 */
dialog.detail { width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 40px); border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--surface); color: var(--text); box-shadow: 0 10px 40px rgba(0,0,0,.25); }
dialog.detail::backdrop { background: rgba(0,0,0,.35); }
.detail-inner { padding: 18px 18px 14px; overflow-y: auto; max-height: calc(100vh - 42px); }
.detail-head { display: flex; gap: 8px; align-items: flex-start; }
.detail-head .hw { font-size: 26px; text-align: left; margin: 0; flex: 1; }
.meta-line { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 8px; }

/* 記録 */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.stat .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12px; color: var(--muted); }
.bars { margin-top: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(120px, 220px) 1fr 74px; gap: 10px; align-items: center; font-size: 13px; padding: 3px 0; }
.bar { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }
.bar .b-learned { background: var(--good); }
.bar .b-known { background: var(--accent); }
.bar .b-learning { background: var(--warn); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
h2 { font-size: 16px; margin: 20px 0 8px; }
h2:first-child { margin-top: 0; }
.prose p, .prose li { max-width: 72ch; }
.prose ul { padding-left: 1.2em; }
.banner { background: var(--bad-soft); color: var(--text); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 14px; display: none; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
.toast.show { opacity: .95; }

button, .btn, .opt, .item-row, summary, label.chk { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.ls { display: none; }
.pbar { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; margin: -4px 0 10px; }
.pbar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.flash .front.tap { cursor: pointer; }
.show-row { display: flex; justify-content: center; margin-top: auto; padding-top: 12px; }
@media (hover: none) { .kbd, .kbd-hint, .kbd-n { display: none !important; } }
@media (max-width: 640px) {
  body { font-size: 15px; }
  header.top { position: static; }
  .top-inner { padding: calc(10px + env(safe-area-inset-top)) 16px 6px; }
  .brand h1 { font-size: 17px; }
  .brand .sub { font-size: 11px; }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; margin: 0; gap: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav.tabs button { flex: 1 1 0; min-height: 54px; padding: 8px 2px 10px; font-size: 13px; border-bottom: 0; border-top: 3px solid transparent; }
  nav.tabs button[aria-selected="true"] { border-top-color: var(--accent); color: var(--accent); }
  .lf { display: none; }
  .ls { display: inline; }
  main { padding: 12px 16px calc(80px + env(safe-area-inset-bottom)); }
  input, select { font-size: 16px; }
  .filters { padding: 10px 14px; margin-bottom: 10px; }
  .filters summary { font-size: 14px; }
  .flash { min-height: calc(100vh - 250px); min-height: calc(100dvh - 250px); padding: 14px; }
  .flash .front { padding: 22px 0 10px; }
  .show-row, .grades { position: sticky; bottom: calc(56px + env(safe-area-inset-bottom)); background: var(--surface); z-index: 5; }
  .show-row { padding: 12px 0 4px; }
  #flash-show { width: 100%; min-height: 54px; font-size: 16px; }
  .grades { gap: 6px; padding: 10px 0 4px; }
  .grades .btn { font-size: 15px; min-height: 58px; }
  .item-row { padding: 12px 10px; }
  dialog.detail { width: 100vw; max-width: 100vw; height: 100vh; height: 100dvh; max-height: none; margin: 0; border: 0; border-radius: 0; }
  .detail-inner { height: 100%; max-height: none; padding: calc(8px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
  .detail-head { position: sticky; top: calc(-8px - env(safe-area-inset-top)); background: var(--surface); padding: 10px 0 6px; z-index: 2; }
  .detail-head .btn { min-height: 40px; }
  .toast { bottom: calc(70px + env(safe-area-inset-bottom)); }
  .hw { font-size: 25px; }
  .opts { grid-template-columns: 1fr; }
  .item-row { grid-template-columns: 12px minmax(0, 1fr) auto; }
  .item-row .m { grid-column: 2 / 4; }
  .bar-row { grid-template-columns: 100px 1fr 60px; }
  .detail-head .hw { font-size: 22px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><h1>論文の英語</h1><span class="sub" id="brand-sub"></span></div>
    <nav class="tabs" role="tablist" aria-label="学び方">
      <button role="tab" data-tab="flash" aria-selected="true"><span class="lf">単語帳</span><span class="ls">単語帳</span></button>
      <button role="tab" data-tab="cloze" aria-selected="false"><span class="lf">穴埋め</span><span class="ls">穴埋め</span></button>
      <button role="tab" data-tab="choice" aria-selected="false"><span class="lf">英→日・日→英</span><span class="ls">4択</span></button>
      <button role="tab" data-tab="browse" aria-selected="false"><span class="lf">一覧・検索</span><span class="ls">一覧</span></button>
      <button role="tab" data-tab="record" aria-selected="false"><span class="lf">記録</span><span class="ls">記録</span></button>
      <button role="tab" data-tab="about" aria-selected="false"><span class="lf">使い方</span><span class="ls">使い方</span></button>
    </nav>
  </div>
</header>
<main>
  <div class="banner" id="storage-banner">このブラウザでは覚えた度合いを保存できません（閉じると消えます）。プライベートウィンドウやサイトデータの設定を確かめてください。</div>

  <details class="filters card" id="filters" open>
    <summary>出題の範囲（絞り込み）</summary>
    <div class="grid">
      <label>種類<select id="f-kind"><option value="">すべて</option></select></label>
      <label>分類（働き・専門の分野）<select id="f-cat"><option value="">すべて</option></select></label>
      <label>出る論文の数<select id="f-band"><option value="">すべて</option><option value="hi">よく出る（150本以上）</option><option value="mid">ふつう（40〜149本）</option><option value="lo">まれ（39本以下）</option></select></label>
      <label>覚えた度合い<select id="f-state"><option value="">すべて</option><option value="new">未学習</option><option value="learning">学習中</option><option value="learned">覚えた</option><option value="known">知っている</option><option value="wrong">問題で間違えた</option></select></label>
    </div>
    <div class="count" id="f-count"></div>
  </details>

  <!-- 単語帳 -->
  <section class="panel active" id="p-flash" role="tabpanel">
    <div class="row study-head">
      <span class="small muted" id="flash-progress"></span>
      <span class="spacer"></span>
      <label class="chk"><input type="checkbox" id="flash-dir"> 日→英で出す</label>
      <label class="chk"><input type="checkbox" id="flash-ex"> 表に例文を出す</label>
    </div>
    <div class="pbar" aria-hidden="true"><span id="flash-pbar"></span></div>
    <div class="card flash" id="flash-card"></div>
    <p class="small faint kbd-hint" style="margin-top:8px">キー：<span class="kbd">Space</span> 答えを見る　<span class="kbd">1</span>〜<span class="kbd">4</span> 評価　<span class="kbd">K</span> 知っている（もう出さない）　<span class="kbd">Z</span> ひとつ戻す</p>
  </section>

  <!-- 穴埋め -->
  <section class="panel" id="p-cloze" role="tabpanel">
    <div class="row study-head">
      <span class="qstats" id="cloze-stats"></span>
      <span class="spacer"></span>
      <label class="chk"><input type="checkbox" id="cloze-type"> 書いて答える</label>
      <label class="chk"><input type="checkbox" id="cloze-hint" checked> 意味のヒントを出す</label>
    </div>
    <div class="card quiz" id="cloze-card"></div>
  </section>

  <!-- 4択 -->
  <section class="panel" id="p-choice" role="tabpanel">
    <div class="row study-head">
      <span class="qstats" id="choice-stats"></span>
      <span class="spacer"></span>
      <label class="chk"><input type="radio" name="choice-dir" value="ej" checked> 英→日</label>
      <label class="chk"><input type="radio" name="choice-dir" value="je"> 日→英</label>
    </div>
    <div class="card quiz" id="choice-card"></div>
  </section>

  <!-- 一覧 -->
  <section class="panel" id="p-browse" role="tabpanel">
    <div class="row">
      <input type="search" id="q" placeholder="英語・日本語で検索（例：mitigate、減衰、ヘッジ）" style="flex:1; min-width: 200px" aria-label="検索">
      <select id="sort" aria-label="並べ方">
        <option value="np">出る論文の多い順</option>
        <option value="az">ABC順</option>
        <option value="state">覚えていない順</option>
      </select>
      <label class="chk"><input type="checkbox" id="q-ex"> 例文も探す</label>
    </div>
    <div class="list">
      <div class="small muted" id="list-count" style="margin-bottom:6px"></div>
      <div class="list-wrap" id="list"></div>
      <div class="more"><button class="btn" id="list-more">さらに表示</button></div>
    </div>
  </section>

  <!-- 記録 -->
  <section class="panel" id="p-record" role="tabpanel">
    <h2>きょう</h2>
    <div class="stats-grid" id="today-stats"></div>
    <h2>全体</h2>
    <div class="stats-grid" id="all-stats"></div>
    <h2>分類ごとの覚えた度合い</h2>
    <div class="legend"><span><i style="background:var(--good)"></i>覚えた</span><span><i style="background:var(--accent)"></i>知っている</span><span><i style="background:var(--warn)"></i>学習中</span></div>
    <div class="bars" id="cat-bars"></div>
    <h2>設定</h2>
    <div class="card">
      <div class="row">
        <label class="chk">1日の新しい項目の数 <input type="number" id="set-new" min="0" max="200" style="width:80px"></label>
      </div>
      <div class="row" style="margin-top:8px">
        <label class="chk">新しい項目の順番

<script>
(function () {
  'use strict';
  const M = DATA.meta, P = DATA.papers, ITEMS = DATA.items;
  const BY_ID = new Map(ITEMS.map(it => [it.id, it]));
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  // 単語帳の版（例文なし）：穴埋め・4択と、例文にかかわる表示を外す
  const WB = M.mode === 'wordbook';
  if (WB) {
    ['cloze', 'choice'].forEach(t => { const b = document.querySelector('nav.tabs button[data-tab="' + t + '"]'); if (b) b.remove(); const p = document.getElementById('p-' + t); if (p) p.remove(); });
    const fe = document.getElementById('flash-ex'); if (fe) fe.closest('label').remove();
    const qe = document.getElementById('q-ex'); if (qe) qe.closest('label').remove();
    const wo = document.querySelector('#f-state option[value="wrong"]'); if (wo) wo.remove();
    document.querySelector('.brand h1').textContent = '論文の英語 単語帳';
  }
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ------------------------------------------------------------ 保存
  const KEY = 'paper-english-study.v1';
  let storageOK = true;
  function blankState() {
    return { cards: {}, quiz: {}, days: {}, settings: { newPerDay: 20, order: 'np', theme: '', flashDir: false, flashEx: false, clozeType: false, clozeHint: true, choiceDir: 'ej' } };
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return blankState();
      const s = JSON.parse(raw);
      const b = blankState();
      return { cards: s.cards || {}, quiz: s.quiz || {}, days: s.days || {}, settings: Object.assign(b.settings, s.settings || {}) };
    } catch (e) { storageOK = false; return blankState(); }
  }
  let S = load();
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
    catch (e) { storageOK = false; }
    $('#storage-banner').style.display = storageOK ? 'none' : 'block';
  }
  try { localStorage.setItem(KEY + '.probe', '1'); localStorage.removeItem(KEY + '.probe'); } catch (e) { storageOK = false; }
  $('#storage-banner').style.display = storageOK ? 'none' : 'block';

  function today() { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); }
  function dayLog() { const t = today(); if (!S.days[t]) S.days[t] = { rev: 0, neu: 0, q: 0, ok: 0 }; return S.days[t]; }
  function applyTheme() { if (S.settings.theme) document.documentElement.setAttribute('data-theme', S.settings.theme); else document.documentElement.removeAttribute('data-theme'); }
  applyTheme();

  // ------------------------------------------------------------ 覚えた度合い
  function stateOf(id) {
    const c = S.cards[id];
    if (!c) return 'new';
    if (c.known) return 'known';
    if ((c.ivl || 0) >= 21) return 'learned';
    return 'learning';
  }
  const STATE_JA = { new: '未学習', learning: '学習中', learned: '覚えた', known: '知っている' };
  function band(it) { return it.np >= 150 ? 'hi' : (it.np >= 40 ? 'mid' : 'lo'); }

  // ------------------------------------------------------------ 絞り込み
  function fillSelect(sel, obj) { for (const [k, v] of Object.entries(obj)) { const o = document.createElement('option'); o.value = k; o.textContent = v; sel.appendChild(o); } }
  fillSelect($('#f-kind'), M.kinds);
    const catGroups = { '定型表現の働き': ['hedge','boost','add','contrast','cause','example','sequence','result','compare','figure','aim','method','prior','gap','limit','define','structure','quantity','importance'], '専門語の分野': ['bridge','vehicle','dynamics','signal','sensing','damage','numerical','math','ml','road'] };
  for (const [g, keys] of Object.entries(catGroups)) {
    const og = document.createElement('optgroup'); og.label = g;
    for (const k of keys) { if (!M.categories[k]) continue; const o = document.createElement('option'); o.value = k; o.textContent = M.categories[k]; og.appendChild(o); }
    $('#f-cat').appendChild(og);
  }
  const F = { kind: '', field: '', cat: '', band: '', state: '' };
  function passes(it) {
    if (F.kind && it.k !== F.kind) return false;
    if (F.field && it.f !== F.field) return false;
    if (F.cat && it.c !== F.cat) return false;
    if (F.band && band(it) !== F.band) return false;
    if (F.state) {
      if (F.state === 'wrong') { const q = S.quiz[it.id]; if (!q || !q.ng) return false; }
      else if (stateOf(it.id) !== F.state) return false;
    }
    return true;
  }
  function pool() { return ITEMS.filter(passes); }
  function updateCount() {
    const n = pool().length;
    $('#f-count').textContent = '範囲の項目：' + n + '／全 ' + ITEMS.length;
    const parts = [['#f-kind', F.kind], ['#f-cat', F.cat], ['#f-band', F.band], ['#f-state', F.state]].filter(x => x[1]).map(x => $(x[0]).selectedOptions[0].textContent.replace(/（.*）$/, ''));
    $('#filters summary').textContent = (WB ? '範囲' : '出題の範囲') + '：' + (parts.length ? parts.join('・') : 'すべて') + '（' + n + ' 項目）';
  }
  for (const [id, key] of [['#f-kind', 'kind'], ['#f-cat', 'cat'], ['#f-band', 'band'], ['#f-state', 'state']]) {
    $(id).addEventListener('change', e => { F[key] = e.target.value; updateCount(); refreshActive(true); });
  }

  // ------------------------------------------------------------ 表示の部品
  function renderSentence(text, a, b, blank) {
    const parts = [];
    const seg = (s) => esc(s).replace(/\$([^$]*)\$/g, (_, m) => '<span class="math">' + m + '</span>');
    parts.push(seg(text.slice(0, a)));
    if (blank) parts.push('<span class="blank" aria-label="空欄">' + blank + '</span>');
    else parts.push('<mark>' + seg(text.slice(a, b)) + '</mark>');
    parts.push(seg(text.slice(b)));
    return parts.join('');
  }
  function srcLine(ex) {
    const p = P[ex[0]] || ['', '', '', '', ''];
    const page = ex[1] ? 'PDF p.' + ex[1] : '頁不明';
    const head = esc(ex[0] + '　' + p[0] + (p[1] ? ' (' + p[1] + ')' : '') + '　' + page);
    const title = esc(p[2] + (p[3] ? '. ' + p[3] : '') + (p[4] ? '. doi:' + p[4] : ''));
    return '<div class="src"><details><summary title="題名を表示">' + head + '</summary><span class="title">' + title + '</span></details></div>';
  }
  function chips(it) {
    const out = ['<span class="chip ' + (it.k === 'term' ? 'dom' : 'k-word') + '">' + esc(M.kinds[it.k]) + '</span>'];
    if (it.c) out.push('<span class="chip">' + esc(M.categories[it.c]) + '</span>');
    if (it.p && it.p !== M.kinds[it.k]) out.push('<span class="chip">' + esc(it.p) + '</span>');
    out.push('<span class="chip" title="この項目が出る論文の数（全 ' + M.corpus_papers + ' 本のうち）">' + it.np + ' 本</span>');
    return out.join(' ');
  }
  function colLine(it) {
    if (!it.col || !it.col.length) return '';
    const L = it.col.filter(c => c[1] === 'L').map(c => esc(c[0]));
    const R = it.col.filter(c => c[1] === 'R').map(c => esc(c[0]));
    let s = '<div class="col">よく組む語：';
    if (L.length) s += '<b>前</b> ' + L.join(', ') + '　';
    if (R.length) s += '<b>後</b> ' + R.join(', ');
    return s + '</div>';
  }
  function exList(it, n) {
    if (!it.ex || !it.ex.length) return '';
    const xs = it.ex.slice(0, n || it.ex.length);
    return '<ul class="exs">' + xs.map(ex => '<li><div class="ex-text">' + renderSentence(ex[2], ex[3], ex[4]) + '</div>' + srcLine(ex) + '</li>').join('') + '</ul>';
  }
  function itemBody(it, nEx) {
    return '<div class="meaning">' + esc(it.m) + '</div>' + (it.n ? '<p class="note">' + esc(it.n) + '</p>' : '') +
      '<div class="meta-line">' + chips(it) + '</div>' + colLine(it) + exList(it, nEx);
  }
  let toastTimer = null;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800); }

  // ------------------------------------------------------------ 間隔をあけた復習（SM-2 を簡単にしたもの）
  function grade(id, g) {
    const t = today();
    let c = S.cards[id];
    const isNew = !c || !c.reps && !c.lapses && !c.seen;
    if (!c) c = S.cards[id] = { ef: 2.5, ivl: 0, reps: 0, lapses: 0, due: t };
    c.seen = (c.seen || 0) + 1;
    if (g === 1) { c.reps = 0; c.lapses++; c.ivl = 0; c.ef = Math.max(1.3, c.ef - 0.2); c.due = t; }
    else if (g === 2) { c.ivl = Math.max(1, Math.round((c.ivl || 1) * 1.2)); c.ef = Math.max(1.3, c.ef - 0.15); c.reps++; c.due = t + c.ivl; }
    else if (g === 3) { c.ivl = c.reps === 0 ? 1 : (c.reps === 1 ? 3 : Math.max(c.ivl + 1, Math.round(c.ivl * c.ef))); c.reps++; c.due = t + c.ivl; }
    else { c.ivl = c.reps === 0 ? 4 : Math.max(c.ivl + 2, Math.round(c.ivl * c.ef * 1.3)); c.ef += 0.15; c.reps++; c.due = t + c.ivl; }
    c.last = Date.now();
    const d = dayLog(); if (isNew) d.neu++; else d.rev++;
    save();
  }
  function previewIvl(id, g) {
    const c = S.cards[id] || { ef: 2.5, ivl: 0, reps: 0 };
    if (g === 1) return 'すぐ';
    let ivl;
    if (g === 2) ivl = Math.max(1, Math.round((c.ivl || 1) * 1.2));
    else if (g === 3) ivl = c.reps === 0 ? 1 : (c.reps === 1 ? 3 : Math.max(c.ivl + 1, Math.round(c.ivl * c.ef)));
    else ivl = c.reps === 0 ? 4 : Math.max(c.ivl + 2, Math.round(c.ivl * c.ef * 1.3));
    return ivl < 30 ? ivl + '日後' : (ivl < 365 ? Math.round(ivl / 30) + 'か月後' : Math.round(ivl / 365) + '年後');
  }
  function markKnown(id, on) {
    const c = S.cards[id] || (S.cards[id] = { ef: 2.5, ivl: 0, reps: 0, lapses: 0, due: today() });
    c.known = on; c.last = Date.now(); save();
  }

  // ------------------------------------------------------------ 単語帳
  let flash = { queue: [], cur: null, shown: false, relearn: [], done: 0, total: 0 };
  // 誤タップ対策：評価・「知っている」を一つずつ取り消せるように、直前の状態を残す
  let undoStack = [];
  function snapshot() {
    const id = flash.cur, t = today();
    undoStack.push({ id, shown: flash.shown, queue: flash.queue.slice(), relearn: JSON.parse(JSON.stringify(flash.relearn)), done: flash.done,
      card: S.cards[id] ? JSON.parse(JSON.stringify(S.cards[id])) : null, dayKey: t, day: S.days[t] ? JSON.parse(JSON.stringify(S.days[t])) : null });
    if (undoStack.length > 30) undoStack.shift();
  }
  function undoFlash() {
    const u = undoStack.pop(); if (!u) return;
    if (u.card) S.cards[u.id] = u.card; else delete S.cards[u.id];
    if (u.day) S.days[u.dayKey] = u.day; else delete S.days[u.dayKey];
    save();
    if (flash.cur && flash.cur !== u.id && !u.queue.includes(flash.cur)) u.queue.unshift(flash.cur);
    flash.queue = u.queue; flash.relearn = u.relearn; flash.done = u.done; flash.cur = u.id; flash.shown = u.shown;
    renderFlash(); toast('ひとつ戻しました');
  }
  function seededShuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
  function buildFlashQueue() {
    const t = today();
    const p = pool().filter(it => stateOf(it.id) !== 'known');
    const due = p.filter(it => S.cards[it.id] && !S.cards[it.id].known && S.cards[it.id].due <= t && (S.cards[it.id].reps || S.cards[it.id].lapses || S.cards[it.id].seen));
    due.sort((a, b) => S.cards[a.id].due - S.cards[b.id].due);
    const left = Math.max(0, (S.settings.newPerDay | 0) - (dayLog().neu || 0));
    let fresh = p.filter(it => !S.cards[it.id] || !(S.cards[it.id].seen || S.cards[it.id].reps || S.cards[it.id].lapses));
    if (S.settings.order === 'random') fresh = seededShuffle(fresh.slice());
    else if (S.settings.order === 'rare') fresh.sort((a, b) => b.r - a.r);
    else {
      // 出る論文の多い順。ただし種類ごとに順番に混ぜる
      const byK = {}; fresh.sort((a, b) => a.r - b.r).forEach(it => (byK[it.k] = byK[it.k] || []).push(it));
      const ks = Object.keys(byK), mixed = [];
      for (let i = 0; mixed.length < fresh.length; i++) ks.forEach(k => { if (byK[k][i]) mixed.push(byK[k][i]); });
      fresh = mixed;
    }
    flash.queue = due.map(it => it.id).concat(fresh.slice(0, left).map(it => it.id));
    flash.dueCount = due.length; flash.newCount = Math.min(left, fresh.length);
    flash.cur = null; flash.shown = false; flash.relearn = []; flash.done = 0; flash.total = flash.queue.length; undoStack = [];
  }
  function nextFlash() {
    if (flash.relearn.length && (flash.queue.length === 0 || flash.relearn[0].after <= 0)) {
      flash.cur = flash.relearn.shift().id;
    } else {
      flash.cur = flash.queue.shift() || null;
    }
    flash.relearn.forEach(r => r.after--);
    flash.shown = false;
    renderFlash();
    const box = $('#flash-card'); if (box && box.getBoundingClientRect().top < 0) box.scrollIntoView({ block: 'start' });
  }
  function renderFlash() {
    const box = $('#flash-card');
    const remain = flash.queue.length + flash.relearn.length + (flash.cur ? 1 : 0);
    $('#flash-progress').textContent = '残り ' + remain + '・済み ' + flash.done + '（復習 ' + (flash.dueCount || 0) + '・新しい項目 ' + (flash.newCount || 0) + ' で開始）';
    const tot = Math.max(1, flash.done + remain); $('#flash-pbar').style.width = (100 * flash.done / tot).toFixed(1) + '%';
    if (!flash.cur) {
      const d = dayLog();
      box.innerHTML = '<div class="done-box"><div class="meaning">きょうの分は終わりました</div><p class="muted">復習 ' + d.rev + '・新しい項目 ' + d.neu + '。範囲を変えるか、1日の新しい項目の数（記録のタブ）を増やすと続けられます。</p><div class="row" style="justify-content:center"><button class="btn" id="flash-more">新しい項目を10増やす</button>' + (WB ? '' : '<button class="btn" id="flash-go-cloze">穴埋めで練習する</button>') + '</div></div>';
      $('#flash-more').onclick = () => { S.settings.newPerDay = (S.settings.newPerDay | 0) + 10; save(); $('#set-new').value = S.settings.newPerDay; buildFlashQueue(); nextFlash(); };
      const gc = $('#flash-go-cloze'); if (gc) gc.onclick = () => selectTab('cloze');
      return;
    }
    const it = BY_ID.get(flash.cur);
    const st = stateOf(it.id);
    const je = S.settings.flashDir;
    let front;
    if (je) {
      front = '<div class="hw ja">' + esc(it.m) + '</div><div class="muted small">' + esc(M.kinds[it.k]) + (it.p && it.p !== M.kinds[it.k] ? '・' + esc(it.p) : '') + '</div>';
      if (!WB && S.settings.flashEx && it.ex.length) front += '<div class="ex-text" style="text-align:left;margin-top:12px">' + renderSentence(it.ex[0][2], it.ex[0][3], it.ex[0][4], '？') + '</div>';
    } else {
      front = '<div class="hw">' + esc(it.h) + '</div>';
      if (!WB && S.settings.flashEx && it.ex.length) front += '<div class="ex-text" style="text-align:left;margin-top:12px">' + renderSentence(it.ex[0][2], it.ex[0][3], it.ex[0][4]) + '</div>';
    }
    let html = '<div class="row small muted"><span class="dot s-' + st + '"></span>' + STATE_JA[st] + '<span class="spacer"></span>' +
      (undoStack.length ? '<button class="btn small" id="flash-undo" title="Z">↶ 戻す</button>' : '') +
      '<button class="btn small" id="flash-known" title="K"><span class="lf">知っている（もう出さない）</span><span class="ls">知っている</span></button></div>';
    html += '<div class="front' + (flash.shown ? '' : ' tap') + '">' + front + (flash.shown ? '' : '<div class="small faint" style="margin-top:10px">押すと答えが出ます</div>') + '</div>';
    if (!flash.shown) {
      html += '<div class="show-row"><button class="btn primary" id="flash-show" style="min-width:200px">答えを見る <span class="kbd" style="color:inherit;border-color:currentColor">Space</span></button></div>';
    } else {
      html += '<div class="back">' + (je ? '<div class="hw" style="font-size:24px;margin-top:0">' + esc(it.h) + '</div>' : '') + itemBody(it, 3) + '</div>';
      html += '<div class="grades">' +
        [[1, 'もう一度', 'again'], [2, '難しい', ''], [3, '正解', 'good'], [4, '簡単', '']].map(([g, l, cls]) =>
          '<button class="btn ' + cls + '" data-g="' + g + '">' + l + '<small>' + previewIvl(it.id, g) + '<span class="kbd-n">　' + g + '</span></small></button>').join('') + '</div>';
    }
    box.innerHTML = html;
    const show = () => { if (!flash.shown) { flash.shown = true; renderFlash(); } };
    const sb = $('#flash-show'); if (sb) sb.onclick = show;
    const fr = box.querySelector('.front.tap'); if (fr) fr.onclick = show;
    const ub = $('#flash-undo'); if (ub) ub.onclick = undoFlash;
    $('#flash-known').onclick = () => doKnown();
    $$('#flash-card .grades .btn').forEach(b => b.onclick = () => doGrade(+b.dataset.g));
  }
  function doGrade(g) {
    if (!flash.cur || !flash.shown) return;
    snapshot();
    grade(flash.cur, g);
    if (g === 1) flash.relearn.push({ id: flash.cur, after: 4 });
    flash.done++;
    nextFlash();
  }
  function doKnown() {
    if (!flash.cur) return;
    const it = BY_ID.get(flash.cur);
    snapshot();
    markKnown(it.id, true); flash.done++;
    toast('「' + it.h + '」は出さないようにしました（↶ 戻すで取り消し）');
    nextFlash();
  }

  // ------------------------------------------------------------ 問題の共通
  function quizPool() { return pool().filter(it => it.ex.length); }
  function weightedPick(arr) {
    // 間違えた・学習中・未学習を少し優先する
    const t = today();
    let total = 0;
    const w = arr.map(it => {
      const st = stateOf(it.id), q = S.quiz[it.id];
      let x = 1;
      if (st === 'learning') x += 1.5;
      if (st === 'known') x *= 0.3;
      if (q && q.ng > q.ok) x += 2;
      if (S.cards[it.id] && S.cards[it.id].due <= t && st !== 'known') x += 1;
      total += x; return x;
    });
    let r = Math.random() * total;
    for (let i = 0; i < arr.length; i++) { r -= w[i]; if (r <= 0) return arr[i]; }
    return arr[arr.length - 1];
  }
  function recordQuiz(it, ok) {
    const q = S.quiz[it.id] || (S.quiz[it.id] = { ok: 0, ng: 0 });
    if (ok) q.ok++; else q.ng++;
    const d = dayLog(); d.q++; if (ok) d.ok++;
    // 間違えたら、単語帳で学習中の項目はきょう復習に回す
    if (!ok && S.cards[it.id] && !S.cards[it.id].known) S.cards[it.id].due = Math.min(S.cards[it.id].due, today());
    save();
  }
  function sessionStats(key) {
    const s = quizSession[key];
    return s.n ? ('この回：' + s.ok + '／' + s.n + ' 正解') : 'この回：まだ解いていません';
  }
  const quizSession = { cloze: { n: 0, ok: 0 }, choice: { n: 0, ok: 0 } };
  function pickDistinct(cands, n, keyFn, avoid) {
    const out = [], seen = new Set(avoid.map(keyFn));
    for (const c of seededShuffle(cands.slice())) {
      const k = keyFn(c);
      if (seen.has(k)) continue;
      seen.add(k); out.push(c);
      if (out.length >= n) break;
    }
    return out;
  }
  // 意味の要素（「・」などで区切った語）が重なる項目は、ほぼ同じ意味とみなして選択肢に入れない
  const MKEYS = new Map();
  function meaningKeys(it) {
    let k = MKEYS.get(it.id);
    if (!k) { k = it.m.replace(/[〜～…]/g, '').split(/[・／、，,（）()「」]/).map(x => x.trim()).filter(x => x.length >= 2); MKEYS.set(it.id, k); }
    return k;
  }
  function closeMeaning(a, b) {
    const ka = meaningKeys(a), kb = meaningKeys(b);
    return ka.some(x => kb.some(y => x === y || (x.length >= 3 && y.includes(x)) || (y.length >= 3 && x.includes(y))));
  }
  function distractorPool(it, needEx, extraFilter) {
    let c = ITEMS.filter(x => x.id !== it.id && x.k === it.k && (!needEx || x.ex.length) && !closeMeaning(it, x) && (!extraFilter || extraFilter(x)));
    if (it.k === 'term') {
      // 専門語は同じ分野から（紛らわしいほうが練習になる）
      const same = c.filter(x => x.c === it.c); if (same.length >= 6) c = same;
    } else if (it.c) {
      // つなぎの語・ヘッジなどは、同じ働きの語が同義になりやすいので別の働きから選ぶ
      const other = c.filter(x => x.c && x.c !== it.c); if (other.length >= 6) c = other;
    }
    // 品詞をそろえる（意味の4択で品詞の違いがヒントにならないように）
    if (it.p) { const pos = it.p.split('・')[0]; const same = c.filter(x => x.p && x.p.split('・')[0] === pos); if (same.length >= 6) c = same; }
    return c;
  }
  function similarItems(it, extraFilter) { return distractorPool(it, true, extraFilter); }
  function normAns(s) { return s.toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim(); }

  // ------------------------------------------------------------ 穴埋め
  let cloze = null;
  function surfaceOf(ex) { return ex[2].slice(ex[3], ex[4]); }
  function caseLike(s, model) {
    if (!s) return s;
    const up = /^[A-Z]/.test(model);
    if (up) return s[0].toUpperCase() + s.slice(1);
    if (s.length > 1 && /[a-z]/.test(s[1])) return s[0].toLowerCase() + s.slice(1);
    return s;
  }
  function newCloze() {
    const p = quizPool();
    if (!p.length) { $('#cloze-card').innerHTML = '<p class="muted">範囲に例文のある項目がありません。絞り込みを変えてください。</p>'; return; }
    const it = weightedPick(p);
    const ex = it.ex[Math.floor(Math.random() * it.ex.length)];
    const ans = surfaceOf(ex);
    const lenOK = x => { const s = surfaceOf(x.ex[0]); return s.length >= ans.length * 0.4 && s.length <= ans.length * 2.2 + 4; };
    let others = similarItems(it, lenOK);
    if (others.length < 3) others = similarItems(it);
    const ds = pickDistinct(others, 3, x => normAns(surfaceOf(x.ex[0])), [it]).map(x => ({ id: x.id, text: caseLike(surfaceOf(x.ex[Math.floor(Math.random() * x.ex.length)]), ans) }));
    const opts = seededShuffle([{ id: it.id, text: ans, correct: true }].concat(ds.filter(d => normAns(d.text) !== normAns(ans))));
    cloze = { it, ex, ans, opts, done: false };
    renderCloze();
  }
  function renderCloze() {
    $('#cloze-stats').textContent = sessionStats('cloze');
    const c = cloze; if (!c) return;
    const hint = S.settings.clozeHint ? '<div class="small muted">ヒント：' + esc(c.it.m) + '（' + esc(M.kinds[c.it.k]) + '）</div>' : '';
    let html = hint + '<div class="prompt">' + renderSentence(c.ex[2], c.ex[3], c.ex[4], c.done ? null : '＿＿＿') + '</div>';
    if (c.done) html += srcLine(c.ex);
    if (S.settings.clozeType) {
      html += '<div class="typed"><input type="text" id="cloze-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="空欄に入る語句" ' + (c.done ? 'disabled' : '') + ' value="' + esc(c.typed || '') + '"><button class="btn primary" id="cloze-submit" ' + (c.done ? 'disabled' : '') + '>答える</button></div>';
      if (!c.done) html += '<div class="small faint" style="margin-top:6px">最初の文字：<b>' + esc(c.ans[0]) + '</b>　語数：' + c.ans.split(/\s+/).length + '</div>';
    } else {
      html += '<div class="opts">' + c.opts.map((o, i) => {
        let cls = 'opt en';
        if (c.done && o.correct) cls += ' correct';
        if (c.done && c.picked === i && !o.correct) cls += ' wrong';
        return '<button class="' + cls + '" data-i="' + i + '" ' + (c.done ? 'disabled' : '') + '><span class="n">' + (i + 1) + '</span><span>' + esc(o.text) + '</span></button>';
      }).join('') + '</div>';
    }
    if (c.done) {
      html += '<div class="feedback ' + (c.ok ? 'ok' : 'ng') + '"><b>' + (c.ok ? '正解' : '不正解') + '</b>　答え：<span style="font-family:var(--serif)">' + esc(c.ans) + '</span>　見出し語：<a href="#" id="cloze-open">' + esc(c.it.h) + '</a><div>' + esc(c.it.m) + '</div>' + (c.it.n ? '<div class="small muted">' + esc(c.it.n) + '</div>' : '') + '</div>';
      html += '<div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn primary" id="cloze-next">次へ <span class="kbd" style="color:inherit;border-color:currentColor">Enter</span></button></div>';
    }
    $('#cloze-card').innerHTML = html;
    $$('#cloze-card .opt').forEach(b => b.onclick = () => answerCloze(+b.dataset.i));
    const sub = $('#cloze-submit'); if (sub) sub.onclick = () => answerClozeTyped();
    const inp = $('#cloze-input'); if (inp && !c.done) { inp.focus(); inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); answerClozeTyped(); } }; }
    const nx = $('#cloze-next'); if (nx) { nx.onclick = newCloze; nx.focus(); }
    const op = $('#cloze-open'); if (op) op.onclick = e => { e.preventDefault(); openDetail(c.it.id); };
  }
  function finishCloze(ok) {
    cloze.done = true; cloze.ok = ok;
    quizSession.cloze.n++; if (ok) quizSession.cloze.ok++;
    recordQuiz(cloze.it, ok); renderCloze();
  }
  function answerCloze(i) { if (cloze.done) return; cloze.picked = i; finishCloze(!!cloze.opts[i].correct); }
  function answerClozeTyped() {
    if (cloze.done) return;
    const v = ($('#cloze-input') || {}).value || '';
    cloze.typed = v;
    const a = normAns(v);
    const ok = a && (a === normAns(cloze.ans) || a === normAns(cloze.it.h));
    finishCloze(!!ok);
  }

  // ------------------------------------------------------------ 英→日・日→英
  let choice = null;
  function newChoice() {
    const p = pool();
    if (!p.length) { $('#choice-card').innerHTML = '<p class="muted">範囲に項目がありません。絞り込みを変えてください。</p>'; return; }
    const it = weightedPick(p);
    const dir = S.settings.choiceDir;
    const others = distractorPool(it, false);
    const key = dir === 'ej' ? (x => x.m) : (x => x.h.toLowerCase());
    const ds = pickDistinct(others, 3, key, [it]);
    const opts = seededShuffle([{ it, correct: true }].concat(ds.map(x => ({ it: x }))));
    choice = { it, dir, opts, done: false };
    renderChoice();
  }
  function renderChoice() {
    $('#choice-stats').textContent = sessionStats('choice');
    const c = choice; if (!c) return;
    const ej = c.dir === 'ej';
    let html = '<div class="small muted">' + esc(M.kinds[c.it.k]) + (c.it.p && c.it.p !== M.kinds[c.it.k] ? '・' + esc(c.it.p) : '') + '</div>';
    html += ej ? '<div class="hw" style="text-align:left">' + esc(c.it.h) + '</div>' : '<div class="prompt ja">' + esc(c.it.m) + '</div>';
    html += '<div class="opts">' + c.opts.map((o, i) => {
      let cls = 'opt' + (ej ? '' : ' en');
      if (c.done && o.correct) cls += ' correct';
      if (c.done && c.picked === i && !o.correct) cls += ' wrong';
      return '<button class="' + cls + '" data-i="' + i + '" ' + (c.done ? 'disabled' : '') + '><span class="n">' + (i + 1) + '</span><span>' + esc(ej ? o.it.m : o.it.h) + '</span></button>';
    }).join('') + '</div>';
    if (c.done) {
      html += '<div class="feedback ' + (c.ok ? 'ok' : 'ng') + '"><b>' + (c.ok ? '正解' : '不正解') + '</b>　<a href="#" id="choice-open">' + esc(c.it.h) + '</a>：' + esc(c.it.m) + (c.it.n ? '<div class="small muted">' + esc(c.it.n) + '</div>' : '') + '</div>';
      if (c.it.ex.length) html += exList(c.it, 1);
      html += '<div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn primary" id="choice-next">次へ <span class="kbd" style="color:inherit;border-color:currentColor">Enter</span></button></div>';
    }
    $('#choice-card').innerHTML = html;
    $$('#choice-card .opt').forEach(b => b.onclick = () => answerChoice(+b.dataset.i));
    const nx = $('#choice-next'); if (nx) { nx.onclick = newChoice; nx.focus(); }
    const op = $('#choice-open'); if (op) op.onclick = e => { e.preventDefault(); openDetail(c.it.id); };
  }
  function answerChoice(i) {
    if (choice.done) return;
    choice.done = true; choice.picked = i; choice.ok = !!choice.opts[i].correct;
    quizSession.choice.n++; if (choice.ok) quizSession.choice.ok++;
    recordQuiz(choice.it, choice.ok); renderChoice();
  }

  // ------------------------------------------------------------ 一覧
  let listShown = 100, listCache = [];
  const ORDER = { new: 0, learning: 1, learned: 2, known: 3 };
  function renderList(reset) {
    if (reset) listShown = 100;
    const q = $('#q').value.trim().toLowerCase();
    const inEx = !WB && $('#q-ex').checked;
    let arr = pool();
    if (q) {
      arr = arr.filter(it => it.h.toLowerCase().includes(q) || it.m.toLowerCase().includes(q) || it.n.toLowerCase().includes(q) ||
        (it.c && M.categories[it.c].toLowerCase().includes(q)) ||
        (inEx && it.ex.some(e => e[2].toLowerCase().includes(q))));
    }
    const sort = $('#sort').value;
    if (sort === 'az') arr.sort((a, b) => a.h.localeCompare(b.h, 'en', { sensitivity: 'base' }));
    else if (sort === 'state') arr.sort((a, b) => ORDER[stateOf(a.id)] - ORDER[stateOf(b.id)] || a.r - b.r);
    else arr.sort((a, b) => a.r - b.r);
    listCache = arr;
    $('#list-count').textContent = arr.length + ' 項目' + (q ? '（「' + q + '」）' : '');
    $('#list').innerHTML = arr.slice(0, listShown).map(it => {
      const st = stateOf(it.id);
      return '<div class="item-row" data-id="' + esc(it.id) + '" tabindex="0" role="button"><span class="dot s-' + st + '" title="' + STATE_JA[st] + '"></span><span class="h">' + esc(it.h) + '</span><span class="m">' + esc(it.m) + '</span><span class="np">' + it.np + '本</span></div>';
    }).join('') || '<div style="padding:14px" class="muted">見つかりません。</div>';
    $('#list-more').style.display = arr.length > listShown ? '' : 'none';
    $$('#list .item-row').forEach(r => {
      r.onclick = () => openDetail(r.dataset.id);
      r.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetail(r.dataset.id); } };
    });

  if (!WB) $('#q-ex').addEventListener('change', () => renderList(true));

  // ------------------------------------------------------------ 記録
  function renderRecord() {
    const t = today(), d = S.days[t] || { rev: 0, neu: 0, q: 0, ok: 0 };
    const dueNow = ITEMS.filter(it => { const c = S.cards[it.id]; return c && !c.known && (c.reps || c.lapses || c.seen) && c.due <= t; }).length;
    let streak = 0; for (let k = t; S.days[k] && (S.days[k].rev + S.days[k].neu + S.days[k].q) > 0; k--) streak++;
    const stat = (v, l) => '<div class="stat"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>';
    $('#today-stats').innerHTML = stat(d.neu, '新しく覚え始めた') + stat(d.rev, '復習した') + stat(dueNow, 'いま復習が必要') +
      (WB ? '' : stat(d.q ? Math.round(100 * d.ok / d.q) + '%' : '—', '問題の正解率（' + d.q + '問）')) + stat(streak, '続けている日数');
    const cnt = { new: 0, learning: 0, learned: 0, known: 0 };
    ITEMS.forEach(it => cnt[stateOf(it.id)]++);
    let qn = 0, qo = 0; Object.values(S.quiz).forEach(q => { qn += q.ok + q.ng; qo += q.ok; });
    $('#all-stats').innerHTML = stat(ITEMS.length, '全項目') + stat(cnt.learned, '覚えた（間隔21日以上）') + stat(cnt.learning, '学習中') + stat(cnt.known, '知っている') + stat(cnt.new, '未学習') +
      (WB ? '' : stat(qn ? Math.round(100 * qo / qn) + '%' : '—', 'これまでの問題の正解率（' + qn + '問）'));
    const groups = [];
    for (const k of Object.keys(M.kinds)) groups.push(['種類：' + M.kinds[k], it => it.k === k]);
    for (const k of Object.keys(M.categories)) groups.push([M.categories[k], it => it.c === k]);

      const xs = ITEMS.filter(fn); if (!xs.length) return '';
      const c2 = { learning: 0, learned: 0, known: 0 }; xs.forEach(it => { const s = stateOf(it.id); if (s in c2) c2[s]++; });
      const pct = v => (100 * v / xs.length).toFixed(1) + '%';
      return '<div class="bar-row"><span>' + esc(name) + '</span><span class="bar"><span class="b-learned" style="width:' + pct(c2.learned) + '"></span><span class="b-known" style="width:' + pct(c2.known) + '"></span><span class="b-learning" style="width:' + pct(c2.learning) + '"></span></span><span class="small muted">' + (c2.learned + c2.known) + '／' + xs.length + '</span></div>';
    }).join('');
    $('#set-new').value = S.settings.newPerDay;
    $('#set-order').value = S.settings.order;
    $('#set-theme').value = S.settings.theme || '';
  }

  $('#set-order').addEventListener('change', e => { S.settings.order = e.target.value; save(); });

  // ------------------------------------------------------------ タブ
  let active = 'flash';
  function selectTab(name) {
    active = name;
    $$('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
    $$('.panel').forEach(p => p.classList.toggle('active', p.id === 'p-' + name));
    $('#filters').style.display = (name === 'record' || name === 'about') ? 'none' : '';
    refreshActive(false);
    window.scrollTo(0, 0);
  }
  function refreshActive(filterChanged) {
    if (active === 'flash') { if (filterChanged || !flash.cur) { buildFlashQueue(); nextFlash(); } else renderFlash(); }
    else if (active === 'cloze') { if (filterChanged || !cloze) newCloze(); else renderCloze(); }
    else if (active === 'choice') { if (filterChanged || !choice) newChoice(); else renderChoice(); }
    else if (active === 'browse') renderList(filterChanged);
    else if (active === 'record') renderRecord();
    else if (active === 'about') renderAbout();
  }
  $$('nav.tabs button').forEach(b => b.onclick = () => selectTab(b.dataset.tab));

  // 設定の切り替え
  $('#flash-dir').checked = !!S.settings.flashDir;
  if (!WB) $('#flash-ex').checked = !!S.settings.flashEx;
  if (!WB) { $('#cloze-type').checked = !!S.settings.clozeType; $('#cloze-hint').checked = S.settings.clozeHint !== false; }
  $$('input[name="choice-dir"]').forEach(r => { r.checked = r.value === S.settings.choiceDir; });
  $('#flash-dir').onchange = e => { S.settings.flashDir = e.target.checked; save(); renderFlash(); };
  if (!WB) {
    $('#flash-ex').onchange = e => { S.settings.flashEx = e.target.checked; save(); renderFlash(); };
    $('#cloze-type').onchange = e => { S.settings.clozeType = e.target.checked; save(); if (cloze && !cloze.done) renderCloze(); };
    $('#cloze-hint').onchange = e => { S.settings.clozeHint = e.target.checked; save(); renderCloze(); };
  }
  $$('input[name="choice-dir"]').forEach(r => r.onchange = e => { S.settings.choiceDir = e.target.value; save(); newChoice(); });

  // キー操作
  document.addEventListener('keydown', e => {
    if ($('#detail').open) { if (e.key === 'Escape') closeDetail(); return; }
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (active === 'flash' && (e.key === 'z' || e.key === 'Z') && undoStack.length) { e.preventDefault(); undoFlash(); return; }
    if (active === 'flash' && flash.cur) {
      if (e.key === ' ' || e.key === 'Enter') { if (!flash.shown) { e.preventDefault(); flash.shown = true; renderFlash(); } }
      else if (/^[1-4]$/.test(e.key) && flash.shown) { e.preventDefault(); doGrade(+e.key); }
      else if (e.key === 'k' || e.key === 'K') { e.preventDefault(); doKnown(); }
    } else if (active === 'cloze' && cloze) {
      if (!cloze.done && !S.settings.clozeType && /^[1-4]$/.test(e.key)) { e.preventDefault(); answerCloze(+e.key - 1); }
      else if (cloze.done && e.key === 'Enter') { e.preventDefault(); newCloze(); }
    } else if (active === 'choice' && choice) {
      if (!choice.done && /^[1-4]$/.test(e.key)) { e.preventDefault(); answerChoice(+e.key - 1); }
      else if (choice.done && e.key === 'Enter') { e.preventDefault(); newChoice(); }
    }
  });

  $('#brand-sub').textContent = WB ? (ITEMS.length + ' 項目・論文 ' + M.corpus_papers + ' 本の本文に出る語から（例文なしの版）')
    : (ITEMS.length + ' 項目・論文 ' + M.corpus_papers + ' 本の本文から（研究室の中だけで使う）');
  updateCount();
  if (window.matchMedia && window.matchMedia('(max-width: 640px)').matches) $('#filters').open = false;
  refreshActive(true);
})();
</script>
</body>
